[package]
name = "cmds"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dumprev"
path = "dumprev.rs"

[[bin]]
name = "idxdump"
path = "idxdump.rs"

[[bin]]
name = "hgqlserve"
path = "hgqlserve.rs"

[dependencies]
clap = "4"
juniper = "0.17"
mercurial = { path = "../mercurial" }
mercurial-graphql = { path = "../mercurial-graphql" }
mercurial-types = { path = "../mercurial-types" }
serde_json = "1"
tiny_http = "0.12"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fbcode_build)"] }
