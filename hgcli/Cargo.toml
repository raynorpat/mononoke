[package]
name = "hgcli"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
clap = "4"
futures = "0.3"
futures-ext = { path = "../futures-ext" }
sshrelay = { path = "../sshrelay" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }

[target.'cfg(windows)'.dependencies]
mononoke = { path = "../server" }
