[package]
name = "mononoke"
version = "0.1.0"
edition = "2021"

[dependencies]
async-compression = { path = "../async-compression" }
bookmarks = { path = "../bookmarks" }
bytes = "1"
clap = "4"
flate2 = "1"
zstd = "0.13"
futures = "0.3"
futures-ext = { path = "../futures-ext" }
hgproto = { path = "../hgproto" }
mercurial = { path = "../mercurial" }
mercurial-bundles = { path = "../mercurial-bundles" }
mercurial-types = { path = "../mercurial-types" }
object_store = { version = "0.12", features = ["aws", "azure"] }
sha2 = "0.10"
slog = "2"
slog-term = "2"
sshrelay = { path = "../sshrelay" }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

[dev-dependencies]
mercurial-types = { path = "../mercurial-types" }
rcgen = "0.13"

[target.'cfg(windows)'.dependencies]
socket2 = "0.6"
