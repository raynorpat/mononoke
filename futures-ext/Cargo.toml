[package]
name = "futures-ext"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
quickcheck = "1"
tokio = { version = "1", features = ["macros", "rt"] }
